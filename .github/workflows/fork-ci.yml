# Fork-only CI.
#
# Purpose: run every check that a pull request against `apache/devlake` would
# trigger, but on this fork's feature branches, so a branch can be verified
# before the upstream PR is opened.
#
# Why it is needed: the upstream workflows only trigger on `push` to `main` and
# on `pull_request` with base `main`/`release-*`. In this fork we work on
# feature branches (`pr/**`, `fix/**`, ...) and often stack pull requests on top
# of each other, so those workflows never run beforehand.
#
# On top of that, the upstream jobs run inside `mericodev/lake-builder:latest`,
# an image only the upstream maintainers can publish. Its published build is
# stale (Go 1.20, libgit2 1.3.2, mockery v2), so every branch that upgrades
# dependencies fails with errors that have nothing to do with the change
# itself. This workflow therefore builds the builder image from
# `devops/docker/lake-builder/Dockerfile` (the very file such branches update)
# and publishes it to GHCR, keyed by the Dockerfile hash so it is only rebuilt
# when the recipe changes.
#
# Coverage map -- keep in sync when an upstream workflow changes:
#
#   upstream workflow            | job here                 | upstream PR trigger
#   -----------------------------|--------------------------|--------------------
#   golangci-lint.yml            | golangci-lint            | pull_request (any base)
#   migration-script-lint.yml    | migration-script-lint    | pull_request (any base)
#   test.yml                     | unit-test                | PR -> main/release-*
#   test-e2e.yml                 | e2e-mysql, e2e-postgres  | PR -> main/release-*
#   config-ui.yml                | config-ui                | PR -> main (config-ui/**)
#   asf-header-check.yml         | asf-header-check         | PR -> main
#   grafana-dashboards-check.yml | grafana-dashboards-check | PR -> main/release-*
#   NOTICE-year-check.yml        | notice-year-check        | pull_request (any base)
#   commit-msg.yml               | commit-msg               | pull_request (any base)
#   yaml-lint.yml                | yaml-lint                | pull_request (any base)
#   build.yml                    | -- not mirrored          | push only, never on PR
#   build-builder.yml            | -- not mirrored          | tag push only
#   stale.yml                    | -- not mirrored          | schedule only
#   auto-cherry-pick.yml         | -- not mirrored          | merged PRs only
#
# The map above is machine-checked by the `workflow-sync` job below
# (.github/scripts/fork-ci-sync-check.py): it fails when an upstream job gains a
# step, bumps an action/tool pin or a service image that this file does not
# reproduce, and when a new upstream workflow starts running on `pull_request`
# without a mirror here. Without that guard the mirror decays silently -- and a
# weaker mirror is worse than none: fork-ci goes green, the upstream PR goes red.
#
# Deliberately stricter than upstream:
#   * `config-ui` runs without the `paths: config-ui/**` filter.
#   * `unit-test` and the two e2e jobs run without the `paths:` filters of
#     test.yml / test-e2e.yml.
#   * `commit-msg` also runs on `push`, linting every commit since the merge
#     base with `origin/main`. Upstream can only lint on `pull_request`, so
#     without this the message lint would first be exercised *after* the
#     upstream PR is opened -- exactly what this workflow exists to prevent.
#   * The `install-*.sh` toolchain scripts run even though the self-built image
#     already ships a toolchain: upstream pins Go 1.26.6 / mockery 3.7.4 via
#     those scripts, while the image Dockerfile installs Go 1.26.2. Running them
#     keeps the fork on the exact upstream toolchain. They are idempotent and
#     exit early when the version already matches.
#   * `migration-script-lint` installs Go as well. Upstream does not (the job
#     uses the image's old Go against a `go 1.26` directive) -- that
#     inconsistency is what the pending wave 6 PR fixes.
#
# Guarded so it never runs in `apache/devlake` should the file ever be merged
# upstream.
name: fork-ci

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: fork-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Keeps this file honest: every mirrored job must do at least what the
  # upstream job does, and no upstream pull_request workflow may go unmirrored.
  workflow-sync:
    name: upstream workflow sync
    if: github.repository != 'apache/devlake'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Check fork-ci.yml against the upstream workflows
        run: python3 .github/scripts/fork-ci-sync-check.py

  builder-image:
    name: builder image
    if: github.repository != 'apache/devlake'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - name: Compute image reference
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          tag=$(sha256sum devops/docker/lake-builder/Dockerfile | cut -c1-12)
          echo "image=ghcr.io/$owner/lake-builder:$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: devops/docker/lake-builder
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # mirrors golangci-lint.yml
  golangci-lint:
    name: lint (go)
    needs: builder-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.builder-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Set git config
        run: git config --global --add safe.directory $(pwd)
      - name: Install libgit2 1.5 for git2go v34
        run: backend/scripts/install-libgit2.sh
      - name: Install Go 1.26.6
        run: backend/scripts/install-go.sh
      - name: Install mockery 3.7.4
        run: backend/scripts/install-mockery.sh
      - name: Cache golangci-lint
        id: cache-golangci-lint
        uses: actions/cache@v6
        with:
          path: golangci-lint
          key: ${{ runner.os }}-backend-golangci-lint
      - name: generate mock
        run: |
          go version
          cd backend
          make mock
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: ./backend

  # mirrors migration-script-lint.yml (plus the Go pin from the wave 6 PR)
  migration-script-lint:
    name: migration-script-lint
    needs: builder-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.builder-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Set git config
        run: git config --global --add safe.directory $(pwd)
      - name: Install Go 1.26.6
        run: backend/scripts/install-go.sh
      - name: migration script linting
        run: |
          go version
          cd backend
          go run core/migration/linter/main.go -p backend $(find . -path "**/migrationscripts/**.go")

  # mirrors test.yml
  unit-test:
    name: unit-test
    needs: builder-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.builder-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Set git config
        run: git config --global --add safe.directory $(pwd)
      - name: Install libgit2 1.5 for git2go v34
        run: backend/scripts/install-libgit2.sh
      - name: Install Go 1.26.6
        run: backend/scripts/install-go.sh
      - name: Install mockery 3.7.4
        run: backend/scripts/install-mockery.sh
      - name: Build Python
        run: |
          cd backend
          echo "Building Python"
          make build-python
      - name: Cache unit-test
        id: cache-unit-test
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ${{ env.GOPATH }}/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Unit tests
        run: |
          go version
          cp env.example .env
          cd backend
          make unit-test

  # mirrors test-e2e.yml, job e2e-mysql
  e2e-mysql:
    name: e2e (mysql)
    needs: builder-image
    runs-on: ubuntu-latest
    services:
      db:
        image: mysql:8.4.11
        env:
          MYSQL_DATABASE: lake
          MYSQL_USER: merico
          MYSQL_PASSWORD: merico
          MYSQL_ROOT_PASSWORD: root
    container:
      image: ${{ needs.builder-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - run: git config --global --add safe.directory $(pwd)
      - name: Install libgit2 1.5 for git2go v34
        run: backend/scripts/install-libgit2.sh
      - name: Install Go 1.26.6
        run: backend/scripts/install-go.sh
      - name: Build Python
        run: |
          cd backend
          echo "Building Python"
          make build-python
      - name: Cache test-e2e
        id: cache-test-e2e
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ${{ env.GOPATH }}/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Test-mysql
        env:
          DB_URL: mysql://root:root@db:3306/lake?charset=utf8mb4&parseTime=True
          E2E_DB_URL: mysql://root:root@db:3306/lake?charset=utf8mb4&parseTime=True
        run: |
          go version
          cp env.example .env
          cd backend
          make e2e-test-go-plugins
          make e2e-test

  # mirrors test-e2e.yml, job e2e-postgres
  e2e-postgres:
    name: e2e (postgres)
    needs: builder-image
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18.4
        env:
          POSTGRES_DB: lake
          POSTGRES_USER: merico
          POSTGRES_PASSWORD: merico
    container:
      image: ${{ needs.builder-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - run: git config --global --add safe.directory $(pwd)
      - name: Install libgit2 1.5 for git2go v34
        run: backend/scripts/install-libgit2.sh
      - name: Install Go 1.26.6
        run: backend/scripts/install-go.sh
      - name: Build Python
        run: |
          cd backend
          echo "Building Python"
          make build-python
      - name: Cache test-e2e-pg
        id: cache-test-e2e-pg
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ${{ env.GOPATH }}/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Test-pg
        env:
          DB_URL: postgres://merico:merico@db:5432/lake
          E2E_DB_URL: postgres://merico:merico@db:5432/lake
        run: |
          go version
          cp env.example .env
          cd backend
          make e2e-test-go-plugins
          make e2e-test

  # mirrors config-ui.yml (without its `paths: config-ui/**` filter)
  config-ui:
    name: config-ui
    if: github.repository != 'apache/devlake'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: config-ui/yarn.lock
      - name: Install with Yarn
        run: cd config-ui; yarn
      - name: Run Lint
        run: cd config-ui; yarn tsc && yarn lint

  # mirrors asf-header-check.yml
  asf-header-check:
    name: check Apache license header
    if: github.repository != 'apache/devlake'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check License Header
        uses: apache/skywalking-eyes@main

  # mirrors grafana-dashboards-check.yml
  grafana-dashboards-check:
    name: check grafana dashboards
    if: github.repository != 'apache/devlake'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check grafana dashboards whether using mysql uid
        run: |
          if grep '"type": "mysql"' grafana/dashboards/*; then
              echo "There are dashboards which use mysql uid as datasource"
              exit 1
          fi

  # mirrors NOTICE-year-check.yml
  notice-year-check:
    name: notice-year-check
    if: github.repository != 'apache/devlake'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: check the NOTICE file
        run: grep $(date +"%Y") NOTICE

  # mirrors commit-msg.yml
  #
  # Upstream can only lint on `pull_request` (it needs
  # `github.event.pull_request.base.sha`). Our verification branches are usually
  # only *pushed*, so the message lint would otherwise never run before the
  # upstream PR is opened. The push variant therefore reconstructs the base via
  # the merge base with `origin/main` -- which, on a branch cut from
  # `upstream/main`, covers at least the same commits.
  commit-msg:
    name: commit-msg
    if: github.repository != 'apache/devlake'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Cache lint-commit-message
        id: cache-lint-commit-message
        uses: actions/cache@v6
        with:
          path: lint-commit-message
          key: ${{ runner.os }}-lint-commit-message
      - name: Lint commit message
        if: github.event_name == 'pull_request'
        run: |
          ! git log --oneline ${{ github.event.pull_request.base.sha }}... \
            | grep -vP '^\w{8,40} Merge ' \
            | grep -vP '^\w{8,40} Revert ' \
            | grep -vP '^\w{8,40} (feat|fix|build|chore|docs|style|refactor|perf|test|ci)(\(\w+(-\w+)?\))?:(\s*).*'
      - name: Lint commit message (push, against origin/main)
        if: github.event_name != 'pull_request'
        run: |
          base=$(git merge-base origin/main HEAD || true)
          if [ -z "$base" ]; then
            echo "no merge base with origin/main - nothing to lint"
            exit 0
          fi
          echo "linting commits since $base"
          ! git log --oneline "$base"..HEAD \
            | grep -vP '^\w{8,40} Merge ' \
            | grep -vP '^\w{8,40} Revert ' \
            | grep -vP '^\w{8,40} (feat|fix|build|chore|docs|style|refactor|perf|test|ci)(\(\w+(-\w+)?\))?:(\s*).*'

  # mirrors yaml-lint.yml
  yaml-lint:
    name: lint for yamls
    if: github.repository != 'apache/devlake'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: github/super-linter/slim@v4
        env:
          FILTER_REGEX_INCLUDE: workspace/(docker-compose.yml|deployment/k8s/k8s-deploy.yaml)

